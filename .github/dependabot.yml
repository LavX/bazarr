version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 1
    target-branch: "development"
    groups:
      fortawesome:
        patterns:
          - "@fortawesome*"
      mantine:
        patterns:
          - "@mantine*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[workflow]"
    open-pull-requests-limit: 1
    target-branch: "development"
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 5
    target-branch: "development"
    ignore:
      # 2.10.0 and later depend on cysignals, which cannot be imported outside
      # the main thread. See the tesserocr note in requirements.txt.
      - dependency-name: "tesserocr"
        versions: [">=2.10.0"]
