version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 1
    target-branch: "development"
    groups:
      fortawesome:
        patterns:
          - "@fortawesome*"
      mantine:
        patterns:
          - "@mantine*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[workflow]"
    open-pull-requests-limit: 1
    target-branch: "development"
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 5
    target-branch: "development"
    ignore:
      # subliminal 2.7.0 and later dropped subliminal.subtitle.LanguageType,
      # which subliminal_patch imports, so the whole backend fails to import.
      # Moving past 2.6.x needs a rebase of subliminal_patch, not a pin bump.
      - dependency-name: "subliminal"
        versions: [">=2.7.0"]
