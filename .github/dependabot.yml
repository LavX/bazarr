version: 2
updates:
  - package-ecosystem: 'npm'
    directory: '/frontend'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 1
    target-branch: "development"
    groups:
      fortawesome:
        patterns:
          - "@fortawesome*"
      mantine:
        patterns:
          - "@mantine*"
      react:
        patterns:
          - "react"
          - "react-dom"
          - "@types/react"
          - "@types/react-dom"
  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[workflow]"
    open-pull-requests-limit: 1
    target-branch: "development"
  - package-ecosystem: 'pip'
    directory: '/'
    schedule:
      interval: 'weekly'
    commit-message:
      prefix: "[bot]"
    open-pull-requests-limit: 5
    target-branch: "development"
    ignore:
      # pytest 9.2.0 monkeypatch.setattr undo deletes attributes that live in
      # dict items (the settings sections), failing the compat and backend
      # fixtures. Lift together with the dev-requirements.txt pin.
      - dependency-name: "pytest"
        versions: [">=9.2.0"]
