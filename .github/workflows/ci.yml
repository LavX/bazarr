name: CI

on:
  push:
    branches: [master, development]
    paths:
      - frontend/**
      - bazarr/**
      - custom_libs/**
      - tests/**
      - docs/**
      - migrations/**
      - bazarr.py
      - requirements.txt
      - dev-requirements.txt
      - .github/workflows/ci.yml
  # No branches filter on purpose. A stacked pull request, one whose base is
  # another feature branch rather than development, got no CI at all under
  # `branches: [master, development]`: GitHub simply did not trigger, and the
  # pull request sat green-looking with zero checks.
  #
  # What that costs is a run per opened / synchronize / reopened event on every
  # pull request against any base, not one run per stacked branch: pushing ten
  # times to each branch of a three-deep stack is thirty runs, and each one is a
  # three-way Python matrix plus a Postgres service. The concurrency group below
  # is what keeps it bounded, cancelling a pull request's superseded runs as soon
  # as the next push lands. Pushes to master and development are deliberately not
  # cancelled: those runs are the record of what the branch does.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  ROOT_DIRECTORY: .
  UI_DIRECTORY: ./frontend
  SCRIPTS_DIRECTORY: .github/scripts
  UI_ARTIFACT_NAME: ui

jobs:
  Frontend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: "${{ env.UI_DIRECTORY }}/node_modules"
          key: ${{ runner.os }}-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-modules-

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"

      - name: Install dependencies
        run: npm install
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Types
        run: npm run check:ts
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Styles
        run: npm run check
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Format
        run: npm run check:fmt
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Unit Test (with coverage thresholds)
        run: npm run coverage
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Build
        run: npm run build:ci
        working-directory: ${{ env.UI_DIRECTORY }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

  Backend:
    runs-on: ubuntu-latest
    needs: Frontend
    permissions:
      contents: read

    strategy:
      fail-fast: false
      matrix:
        python-version: [ '3.12', '3.13', '3.14' ]
    name: Python ${{ matrix.python-version }} backend

    # Postgres service so the native-PG local-id cutover migration test actually
    # runs on CI (it skips when no Postgres is reachable) instead of silently
    # passing vacuously.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway password for the ephemeral CI service container.
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: bazarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install UI
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

      - name: Install ffmpeg and unar
        # test_embeddedsubtitles uses real .mkv fixtures that require ffprobe to
        # extract stream metadata. Ubuntu runners ship without it.
        #
        # unar matches what the image installs, and init_binaries() prefers it
        # over 7z for RAR. Without it the runner falls through to its own 7z,
        # whose distro build has the RAR decoder stripped for licensing, so the
        # RAR3 fixture fails to open and CI would diverge from production.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg unar

      - name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # signalrcore over-pins msgpack==1.1.2 (GHSA-6v7p-g79w-8964); install it
          # with --no-deps so our msgpack==1.2.1 from requirements.txt wins.
          pip install --no-deps signalrcore==1.0.2

      - name: Install dev dependencies
        run: pip install -r dev-requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: pytest compat subpackage
        run: |
          pip install pytest pyjwt
          pytest tests/compat/ -v --tb=short

      - name: pytest dependency, Provider Hub, and Subliminal rebase guards
        run: |
          pytest \
            tests/bazarr/test_pretty_date.py \
            tests/bazarr/test_connection_tester.py \
            tests/bazarr/test_database_sqlite_maintenance.py \
            tests/bazarr/test_dependency_loading.py \
            tests/bazarr/test_signalrcore_compat.py \
            tests/bazarr/test_app_get_providers.py \
            tests/bazarr/test_retired_provider_config_compat.py \
            tests/bazarr/test_jellyfin_apikey_location.py \
            tests/bazarr/test_provider_hub.py \
            tests/bazarr/test_provider_hub_auto_install_optin.py \
            tests/bazarr/test_provider_hub_archive_select.py \
            tests/bazarr/test_archive_member_matching.py \
            tests/bazarr/test_provider_hub_worker_timeout.py \
            tests/bazarr/test_arr_instances_schema.py \
            tests/bazarr/test_arr_ownership_columns.py \
            tests/bazarr/test_arr_instance_repository.py \
            tests/bazarr/test_arr_instances_api.py \
            tests/bazarr/test_arr_subtitle_settings.py \
            tests/bazarr/test_arr_client.py \
            tests/bazarr/test_arr_backfill.py \
            tests/bazarr/test_arr_instance_stamping.py \
            tests/bazarr/test_arr_action_scoping.py \
            tests/bazarr/test_sonarr_sync_utils.py \
            tests/bazarr/test_radarr_sync_utils.py \
            tests/bazarr/test_arr_aux_leaves.py \
            tests/bazarr/test_arr_rootfolder.py \
            tests/bazarr/test_arr_local_id_cutover_migration.py \
            tests/bazarr/test_jobs_queue_progress.py \
            tests/bazarr/test_processing_sync_substep.py \
            tests/bazarr/test_processing_postprocessing.py \
            tests/bazarr/test_sync_progress_report.py \
            tests/bazarr/test_subsync_engines.py \
            tests/bazarr/test_sync_offset_acceptance.py \
            tests/bazarr/test_sync_instance_overrides.py \
            tests/bazarr/test_subzero_keep_lyrics.py \
            tests/bazarr/test_combine_aligner.py \
            tests/bazarr/test_combine_api_dto.py \
            tests/bazarr/test_combine_api_episodes.py \
            tests/bazarr/test_combine_api_movies.py \
            tests/bazarr/test_combine_api_series.py \
            tests/bazarr/test_combine_composer.py \
            tests/bazarr/test_combine_hook.py \
            tests/bazarr/test_combine_indexer.py \
            tests/bazarr/test_combine_main.py \
            tests/bazarr/test_combine_naming.py \
            tests/bazarr/test_combine_profile.py \
            tests/bazarr/test_combine_rules.py \
            tests/bazarr/test_archive_extraction.py \
            tests/bazarr/test_security_guards.py \
            tests/bazarr/test_login_backdrops.py \
            tests/bazarr/test_onboarding_flag.py \
            tests/bazarr/test_ui.py \
            tests/bazarr/test_utilities_video_analyzer.py \
            tests/bazarr/test_embedded_subtitle_extraction.py \
            tests/subliminal_patch/test_subliminal_rebase.py \
            tests/subliminal_patch/test_embeddedsubtitles.py \
            tests/subliminal_patch/test_subsunacs.py \
            tests/subliminal_patch/test_filebot_refiner.py \
            tests/subliminal_patch/test_http.py \
            tests/subliminal_patch/test_legendasdivx.py \
            tests/subliminal_patch/test_provider_pool.py \
            tests/subliminal_patch/test_mods.py \
            tests/subliminal_patch/test_mods_keep_lyrics.py \
            tests/subliminal_patch/test_video.py \
            -v --tb=short

      - name: pytest previously unguarded suites
        # One process. These used to be split in two, because init_binaries()
        # repoints rarfile at 7z at import time and the 7z in the image could not
        # decode the RAR fixture, so a co-collected run caught a real product bug
        # and the split hid it. The extractor order now prefers unrar and unar,
        # the image installs unar, and so does this workflow, so the split has
        # nothing left to work around.
        run: |
          pytest \
            tests/bazarr/test_app_notifier.py \
            tests/bazarr/test_auto_translation_profile.py \
            tests/bazarr/test_ci_guard_list.py \
            tests/bazarr/test_combine_aligner.py \
            tests/bazarr/test_combine_api_dto.py \
            tests/bazarr/test_combine_api_episodes.py \
            tests/bazarr/test_combine_api_movies.py \
            tests/bazarr/test_combine_api_series.py \
            tests/bazarr/test_combine_composer.py \
            tests/bazarr/test_combine_hook.py \
            tests/bazarr/test_combine_indexer.py \
            tests/bazarr/test_combine_main.py \
            tests/bazarr/test_combine_naming.py \
            tests/bazarr/test_combine_profile.py \
            tests/bazarr/test_combine_rules.py \
            tests/bazarr/test_compat_cache.py \
            tests/bazarr/test_config.py \
            tests/bazarr/test_config_save.py \
            tests/bazarr/test_embedded_history_indexer.py \
            tests/bazarr/test_encryption.py \
            tests/bazarr/test_extra_languages.py \
            tests/bazarr/test_gemini_translator.py \
            tests/bazarr/test_get_video_scenename_fallback.py \
            tests/bazarr/test_jellyfin_client.py \
            tests/bazarr/test_jellyfin_operations.py \
            tests/bazarr/test_logging_filters.py \
            tests/bazarr/test_provider_hub_install_serialization.py \
            tests/bazarr/test_provider_hub_language_fallback.py \
            tests/bazarr/test_scheduler_session_cleanup.py \
            tests/bazarr/test_secret_store_crypto.py \
            tests/bazarr/test_secret_store_e2e.py \
            tests/bazarr/test_secret_store_migration.py \
            tests/bazarr/test_secret_store_registry.py \
            tests/bazarr/test_signalr_client.py \
            tests/bazarr/test_sonarr_sync_episodes.py \
            tests/bazarr/test_sql_profiler.py \
            tests/bazarr/test_subtitle_content_sync_outputs.py \
            tests/bazarr/test_subtitles_pool.py \
            tests/bazarr/test_supervisor_proxy.py \
            tests/bazarr/test_supervisor_stages.py \
            tests/bazarr/test_tracemalloc_dumper.py \
            tests/bazarr/test_translator_auth.py \
            tests/bazarr/test_upgrade_embedded_history.py \
            tests/subliminal_patch/test_animetosho.py \
            tests/subliminal_patch/test_core_persistent.py \
            tests/subliminal_patch/test_opensubtitles_scraper.py \
            tests/subliminal_patch/test_score.py \
            tests/subliminal_patch/test_subdl_anime_mode.py \
            tests/subliminal_patch/test_subtitle.py \
            tests/subliminal_patch/test_utils.py \
            -v --tb=short

      - name: pytest cross-instance isolation guards (isolated per file)
        # These seed colliding upstream ids across instances and assert no leak -
        # the central invariant of the multiple-arr-instances feature. Several of
        # them leak module/global state (sys.modules, config) when pytest collects
        # them in ONE process, so each runs in its OWN pytest process. The PG
        # cutover test needs a driver + the postgres service (env below).
        env:
          # Same throwaway credentials, in URL form.
          BAZARR_PG_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bazarr_test  # pragma: allowlist secret
        run: |
          set -e
          pip install "psycopg[binary]"
          for f in \
            tests/bazarr/test_editor_api.py \
            tests/bazarr/test_arr_atomicity_secrets.py \
            tests/bazarr/test_arr_pg_cutover_migration.py \
            tests/bazarr/test_editor_instance_scope.py \
            tests/bazarr/test_history_blacklist_scope.py \
            tests/bazarr/test_local_id_actions.py \
            tests/bazarr/test_navigation_local_ids.py \
            tests/bazarr/test_provider_blacklist_instance_scope.py \
            tests/bazarr/test_wanted_instance_scope.py \
            tests/bazarr/test_movies_history_scoping.py \
            tests/bazarr/test_series_identity_counts.py \
            tests/bazarr/test_system_searches.py \
            tests/bazarr/test_api_utils_images.py \
            tests/bazarr/test_threading_scope.py \
            tests/bazarr/test_blacklist_delete_scope.py \
            tests/bazarr/test_content_metadata_scope.py \
            tests/bazarr/test_episode_parser_scope.py \
            tests/bazarr/test_files_browse_instance_scope.py \
            tests/bazarr/test_path_mappings_instance.py \
            tests/bazarr/test_mass_download_path_mapping.py \
            tests/bazarr/test_threading_followup.py \
            tests/bazarr/test_mass_operations.py ; do
            echo "::group::$f"
            pytest "$f" -p no:cacheprovider -q
            echo "::endgroup::"
          done

      - name: Unit Tests
        run: |
          bash '${{ env.SCRIPTS_DIRECTORY }}/build_test.sh'
