name: CI

# One workflow, one verdict: the `ci-ok` job at the bottom is the only check a
# branch rule needs to require. Everything else fans out from the Plan job.
#
# What runs, and when:
#
# - A pull request into development, or into any other branch but master,
#   runs every suite once, on the Python the Docker image ships, split into
#   parallel jobs so the verdict arrives in about ten minutes.
# - A push to development or master, the release pull request into master,
#   the weekly schedule and a manual run add the other supported Python
#   versions, with exactly the same jobs and steps on each.
# - A change that touches documentation only runs the Docs job and skips the
#   rest; .github/scripts/ci_plan.py decides, and fails towards running more.
#
# scripts/ci/run-local.sh runs the same suites on a workstation, in parallel,
# against a throwaway PostgreSQL.
on:
  # No paths filter: Plan skips the suites for a documentation-only push, and a
  # filter here is what let changes to README.md, site/install.sh and the
  # getting-started guide, all three read by a test, land without running it.
  push:
    branches: [master, development]
  # No branches filter on purpose. A stacked pull request, one whose base is
  # another feature branch rather than development, got no CI at all under
  # `branches: [master, development]`: GitHub simply did not trigger, and the
  # pull request sat green-looking with zero checks. The concurrency group
  # below keeps the cost bounded by cancelling a pull request's superseded runs
  # as soon as the next push lands.
  pull_request:
  # The full matrix once a week, so a dependency release that breaks one of
  # the older interpreters is found without waiting for the next merge.
  # GitHub runs schedules on the default branch, master, from its copy of this
  # file.
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  # A newer push supersedes a pull request's run and a development run alike.
  # Runs on master are the record of what a release was built from, so they
  # are never cancelled.
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

permissions:
  contents: read

env:
  ROOT_DIRECTORY: .
  UI_DIRECTORY: ./frontend
  SCRIPTS_DIRECTORY: .github/scripts
  UI_ARTIFACT_NAME: ui

jobs:
  changes:
    name: Plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.plan.outputs.code }}
      docs: ${{ steps.plan.outputs.docs }}
      python: ${{ steps.plan.outputs.python }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # The merge commit and its first parent, the tip of the base branch,
          # which is all a pull request's change list needs.
          fetch-depth: 2
          persist-credentials: false

      - name: Decide what this run has to do
        id: plan
        run: python3 .github/scripts/ci_plan.py

  docs:
    name: Docs
    needs: changes
    if: ${{ needs.changes.outputs.docs == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Install pandoc
        # scripts/release/notes.py renders release notes with pandoc GFM, which
        # is what the public release page does.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends pandoc

      - name: Check the changed documentation
        run: python3 .github/scripts/docs_check.py

  frontend-build:
    name: Frontend build
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - &checkout
        name: Checkout repository
        uses: actions/checkout@v7

      - &node-modules-cache
        name: Cache node_modules
        uses: actions/cache@v6
        with:
          path: "${{ env.UI_DIRECTORY }}/node_modules"
          key: ${{ runner.os }}-node-${{ hashFiles('frontend/.nvmrc') }}-modules-${{ hashFiles('frontend/package-lock.json') }}
          restore-keys: ${{ runner.os }}-node-${{ hashFiles('frontend/.nvmrc') }}-modules-

      - &setup-node
        name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"

      - &npm-install
        name: Install dependencies
        run: npm install
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Build
        run: npm run build:ci
        working-directory: ${{ env.UI_DIRECTORY }}

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

  frontend-checks:
    name: Frontend checks
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - *checkout
      - *node-modules-cache
      - *setup-node
      - *npm-install

      - name: Check Types
        run: npm run check:ts
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Styles
        run: npm run check
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Check Format
        run: npm run check:fmt
        working-directory: ${{ env.UI_DIRECTORY }}

  frontend-tests:
    name: Frontend tests ${{ matrix.shard }}/3
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - *checkout
      - *node-modules-cache
      - *setup-node
      - *npm-install

      - name: Unit Test (shard ${{ matrix.shard }} of 3)
        # Each shard records its results and its coverage in a blob report.
        # The coverage floor is set for the whole src tree, which no single
        # shard reaches, so the thresholds are zeroed here and enforced once,
        # over the merged coverage, by Frontend coverage.
        # The blob goes to a named file in .vitest-reports, the folder the
        # upload below and the merge in Frontend coverage use. Vitest's default
        # folder moved to .vitest/blob in version 5, which left the upload
        # empty, so the path is spelled out rather than left to the default.
        run: >-
          npx vitest run --shard=${{ matrix.shard }}/3
          --reporter=blob --reporter=default
          --outputFile.blob=.vitest-reports/blob-${{ matrix.shard }}.json
          --coverage --coverage.reporter=text-summary
          --coverage.thresholds.lines=0 --coverage.thresholds.statements=0
          --coverage.thresholds.functions=0 --coverage.thresholds.branches=0
        working-directory: ${{ env.UI_DIRECTORY }}

      - uses: actions/upload-artifact@v7
        with:
          name: vitest-blob-${{ matrix.shard }}
          path: "${{ env.UI_DIRECTORY }}/.vitest-reports"
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 3

  frontend-coverage:
    name: Frontend coverage
    needs: [changes, frontend-tests]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - *checkout
      - *node-modules-cache
      - *setup-node
      - *npm-install

      - uses: actions/download-artifact@v8
        with:
          pattern: vitest-blob-*
          path: "${{ env.UI_DIRECTORY }}/.vitest-reports"
          merge-multiple: true

      - name: Unit Test (with coverage thresholds)
        # A missing shard would lower the coverage without necessarily taking
        # it under the floor, so the count is checked before the merge.
        run: |
          count=$(find .vitest-reports -name 'blob-*.json' | wc -l)
          if [ "$count" -ne 3 ]; then
            echo "Expected 3 shard reports, found $count"
            exit 1
          fi
          npx vitest run --merge-reports=.vitest-reports --coverage
        working-directory: ${{ env.UI_DIRECTORY }}

  # The backend is split into seven jobs per Python version. They share their
  # setup through YAML anchors, so every job installs exactly what the single
  # backend job used to, and every Python version runs exactly the same steps.
  # All of them wait for the UI build, because the application imports
  # frontend/build when it is there and the suites have always run with it.
  backend-core:
    name: Backend core (Python ${{ matrix.python-version }})
    needs: [changes, frontend-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy: &python-matrix
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON(needs.changes.outputs.python) }}
    steps:
      - &backend-checkout
        name: Checkout repository
        uses: actions/checkout@v7

      - &setup-python
        name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            dev-requirements.txt

      - &install-ui
        name: Install UI
        uses: actions/download-artifact@v8
        with:
          name: ${{ env.UI_ARTIFACT_NAME }}
          path: "${{ env.UI_DIRECTORY }}/build"

      - &system-packages
        name: Install ffmpeg and a RAR extractor
        # ffmpeg: test_embeddedsubtitles uses real .mkv fixtures that require
        # ffprobe to extract stream metadata, and Ubuntu runners ship without it.
        # unar: the RAR fixtures cannot be read without it. 7z is present on the
        # runner and recognises RAR as a format, but carries no RAR
        # decompression codec, which is the same trap the image once shipped.
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends ffmpeg unar

      - &python-dependencies
        name: Install Python dependencies
        run: |
          pip install -r requirements.txt
          # signalrcore over-pins msgpack==1.1.2 (GHSA-6v7p-g79w-8964); install it
          # with --no-deps so our msgpack==1.2.1 from requirements.txt wins.
          pip install --no-deps signalrcore==1.0.2

      - &dev-dependencies
        name: Install dev dependencies
        run: pip install -r dev-requirements.txt

      - name: Lint with ruff
        run: ruff check .

      - name: pytest compat subpackage
        run: |
          pip install pytest pyjwt
          pytest tests/compat/ -v --tb=short

      - name: pytest dependency, Provider Hub, and Subliminal rebase guards
        run: |
          pytest \
            tests/bazarr/test_pretty_date.py \
            tests/bazarr/test_connection_tester.py \
            tests/bazarr/test_database_sqlite_maintenance.py \
            tests/bazarr/test_gestdown_release_matching.py \
