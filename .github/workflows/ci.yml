  ci-ok:
    # The one check to require. It runs whatever happened above, and it is red
    # unless every job either passed or was skipped because Plan decided the
    # change did not need it. A job skipped for any other reason, such as a
    # failed dependency, turns it red too.
    name: ci-ok
    if: ${{ always() }}
    needs:
      - changes
      - docs
      - frontend-build
      - frontend-checks
      - frontend-tests
      - frontend-coverage
      - backend-core
      - backend-suites
      - backend-isolation-1
      - backend-isolation-2
      - backend-isolation-3
      - backend-isolation-4
      - backend-isolation-5
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Every job passed, or was not needed
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'EOF'
          import json
          import os

          needs = json.loads(os.environ["NEEDS"])
          plan = needs["changes"]
          outputs = plan.get("outputs") or {}
          problems = []
          if plan["result"] != "success":
              problems.append(f"Plan finished as {plan['result']}")
          wanted = {"docs": outputs.get("docs") == "true"}
          for name in needs:
              if name not in ("changes", "docs"):
                  wanted[name] = outputs.get("code") == "true"
          for name, required in sorted(wanted.items()):
              result = needs[name]["result"]
              expected = "success" if required else "skipped"
              print(f"{name}: {result} (expected {expected})")
              if result != expected:
                  problems.append(f"{name} finished as {result}, expected {expected}")
          if problems:
              print("\n".join(["", "CI is red:"] + problems))
              raise SystemExit(1)
          print("\nCI is green.")
          EOF
