      - name: Unit Tests
        # Starts the application and checks that it serves the UI.
        run: |
          bash '${{ env.SCRIPTS_DIRECTORY }}/build_test.sh'

  # The cross-instance isolation guards. These seed colliding upstream ids
  # across instances and assert no leak, the central invariant of the
  # multiple-arr-instances feature. Several of them leak module/global state
  # (sys.modules, config) when pytest collects them in ONE process, so each
  # file runs in its OWN pytest process, one after another within a job. The
  # files are spread over 5 jobs by their recorded run time, about five
  # minutes each; add a new file to whichever job is currently the shortest.
  # The PG suites need a driver and the postgres service (env below).

  backend-isolation-1:
    name: Backend isolation 1/5 (Python ${{ matrix.python-version }})
    needs: [changes, frontend-build]
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy: *python-matrix
    # Postgres service so the native-PG suites actually run on CI (they skip,
    # or fail, when no Postgres is reachable) instead of passing vacuously.
    services: &postgres
      postgres:
        image: postgres:16-alpine
        env:
          # Throwaway password for the ephemeral CI service container.
          POSTGRES_PASSWORD: postgres  # pragma: allowlist secret
          POSTGRES_DB: bazarr_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - *backend-checkout
      - *setup-python
      - *install-ui
      - *system-packages
      - *python-dependencies
      - *dev-dependencies

      - name: pytest cross-instance isolation guards 1/5 (isolated per file)
        env: &postgres-url
          # Same throwaway credentials, in URL form.
          BAZARR_PG_TEST_URL: postgresql+psycopg://postgres:postgres@localhost:5432/bazarr_test  # pragma: allowlist secret
        run: |
          set -e
          pip install "psycopg[binary]"
          for f in \
            tests/bazarr/test_discover_digital_releases.py \
            tests/bazarr/test_discover_recent_episodes.py \
            tests/bazarr/test_editor_api.py \
            tests/bazarr/test_media_server_convergence_migration.py \
            tests/bazarr/test_sportarr_leagues.py \
            tests/bazarr/test_sportarr_workflows.py \
            tests/bazarr/test_sportarr_audio_language.py \
            tests/bazarr/test_history_owner_resolution.py \
            tests/bazarr/test_navigation_local_ids.py \
            tests/bazarr/test_wanted_instance_scope.py \
            tests/bazarr/test_api_utils_images.py \
            tests/bazarr/test_blacklist_delete_scope.py \
            tests/bazarr/test_threading_followup.py \
            tests/bazarr/test_indexer_owner_scope.py \
            tests/bazarr/test_indexer_path_mapping_owner.py \
            tests/bazarr/test_anilist_index.py \
            tests/bazarr/test_package_info_location.py \
            tests/bazarr/test_translate_owner_threading.py ; do
            echo "::group::$f"
            pytest "$f" -p no:cacheprovider -q
            echo "::endgroup::"
          done

