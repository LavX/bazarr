name: End-to-end tests

# On demand only. This is not a required check: it builds the image, starts
# real Bazarr+ containers from it and drives them with Playwright. Specs that
# need the provider network (@live) are left out; run those locally.
on:
  workflow_dispatch:
    inputs:
      grep:
        description: "Only run tests matching this tag or title, for example @wizard"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UI_DIRECTORY: ./frontend
  BAZARR_E2E_IMAGE: bazarr-e2e:ci

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup NodeJS
        uses: actions/setup-node@v7
        with:
          node-version-file: "${{ env.UI_DIRECTORY }}/.nvmrc"

      - name: Install dependencies
        run: npm ci
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Build frontend
        run: npm run build
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Build image
        run: docker build --tag "$BAZARR_E2E_IMAGE" .

      - name: Install Chromium
        run: npx playwright install --with-deps chromium
        working-directory: ${{ env.UI_DIRECTORY }}

      - name: Run end-to-end tests
        run: |
          if [ -n "$GREP" ]; then
            npm run e2e -- --grep "$GREP"
          else
            npm run e2e
          fi
        working-directory: ${{ env.UI_DIRECTORY }}
        env:
          GREP: ${{ inputs.grep }}

      - name: Upload report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: |
            ${{ env.UI_DIRECTORY }}/e2e-report/
            ${{ env.UI_DIRECTORY }}/e2e-results/
          retention-days: 14
