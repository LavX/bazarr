# =============================================================================
# Bazarr+ Docker Compose
# =============================================================================
# Production deployment configuration
#
# Usage:
#   docker compose up -d
#
# Environment variables can be set in a .env file or directly in the environment
# =============================================================================

services:
  # FlareSolverr (strongly recommended)
  # The OpenSubtitles.org provider is a native Provider Hub plugin in Bazarr+.
  # It scrapes in-process with ai-cloudscraper, and falls back to FlareSolverr
  # when OpenSubtitles.org returns a Cloudflare browser challenge. After you
  # install the OpenSubtitles.org plugin from the Marketplace, set its
  # "FlareSolverr URL" to http://flaresolverr:8191/v1 in the provider settings.
  # That hostname resolves because both services share the bazarr-network
  # bridge defined below. If you instead run Bazarr with host networking
  # (network_mode: host), use http://localhost:8191/v1 in the plugin settings.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    ports:
      - "${FLARESOLVERR_PORT:-8191}:8191"
    environment:
      - LOG_LEVEL=${FLARESOLVERR_LOG_LEVEL:-info}
      - TZ=${TZ:-UTC}
    networks:
      - bazarr-network

  bazarr:
    image: ghcr.io/lavx/bazarr:latest
    container_name: bazarr
    restart: unless-stopped
    depends_on:
      - flaresolverr

    ports:
      - "${BAZARR_PORT:-6767}:6767"
    
    environment:
      # User/Group ID for file permissions
      # Match these to your media user on the host
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      
      # Timezone (e.g., Europe/Budapest, America/New_York)
      - TZ=${TZ:-UTC}

    volumes:
      # Configuration directory - contains database, logs, and settings
      - ${CONFIG_PATH:-./config}:/config
      
      # Media directories - adjust paths to match your setup
      # Movies library
      - ${MOVIES_PATH:-/path/to/movies}:/movies
      
      # TV Shows library
      - ${TV_PATH:-/path/to/tv}:/tv
      
      # Optional: Additional media paths
      # - /path/to/anime:/anime
      # - /path/to/downloads:/downloads

    # Container hardening. The image is built to run this way: the application
    # tree is owned by root and everything written at runtime goes to /config,
    # so the only writable places a provider plugin's worker can reach are the
    # ones it is supposed to reach.
    #
    # read_only freezes the image filesystem, cap_drop takes away every Linux
    # capability, and no-new-privileges stops a setuid binary from raising
    # privileges even if one were somehow reachable.
    #
    # The tmpfs gives back a writable /tmp. Extraction and the sync engines do
    # not need it, they work under /config/cache and beside the destination
    # file, but subtitle bundle downloads spill into it past their in-memory
    # ceiling, the Provider Hub and sports workers put their per-request
    # temporary directories there, and the alass shim falls back to it when the
    # config cache cannot hold an executable. The size cap matters: an uncapped
    # tmpfs may grow to half of host RAM, and it is charged to the host, not to
    # this container's memory limit.
    #
    # Mounting your own source over /app/bazarr for development is not
    # compatible with read_only: drop that key in that case.
    read_only: true
    tmpfs:
      - /tmp:size=512m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      # The startup needs exactly three, and only while it is still root:
      # CHOWN to hand /config to PUID:PGID, SETUID and SETGID for the drop to
      # that user. Everything after the drop, which is all of Bazarr and every
      # Provider Hub worker, runs with no capabilities at all, because a
      # non-root process keeps none of them.
      - CHOWN
      - SETUID
      - SETGID
    
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:6767/_supervisor/status | grep -q '\"running\"'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    
    networks:
      - bazarr-network
    
    # Optional: Resource limits
    # deploy:
    #   resources:
    #     limits:
    #       cpus: '2.0'
    #       memory: 2G
    #     reservations:
    #       cpus: '0.5'
    #       memory: 512M

networks:
  bazarr-network:
    driver: bridge

# =============================================================================
# Example .env file contents:
# =============================================================================
# BAZARR_PORT=6767
# FLARESOLVERR_PORT=8191
# PUID=1000
# PGID=1000
# TZ=Europe/Budapest
# CONFIG_PATH=./config
# MOVIES_PATH=/mnt/media/movies
# TV_PATH=/mnt/media/tv
# =============================================================================