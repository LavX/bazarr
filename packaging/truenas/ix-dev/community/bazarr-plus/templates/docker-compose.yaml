{% set tpl = ix_lib.base.render.Render(values) %}

{% set app = tpl.add_container(values.consts.bazarr_plus_container_name, "image") %}
{% set perms = tpl.deps.perms(values.consts.perms_container_name) %}
{% set perms_config = {"uid": values.run_as.user, "gid": values.run_as.group, "mode": "check"} %}

{# The image entrypoint needs root, then uses gosu to drop to PUID:PGID. #}
{% do app.set_user(0, 0) %}
{% do app.add_caps(["CHOWN", "SETGID", "SETUID"]) %}
{% do app.set_read_only(true) %}
{% do app.healthcheck.use_built_in() %}
{% do app.add_storage("/tmp", {"type": "tmpfs", "tmpfs_config": {"size": 512, "mode": "0777"}}) %}

{# The library derives PUID and PGID from run_as. Keep the image command and healthcheck. #}
{% do app.add_port(values.network.web_port, {"container_port": values.consts.internal_web_port}) %}
{% do app.environment.add_user_envs(values.bazarr_plus.additional_envs) %}

{% do app.add_storage("/config", values.storage.config) %}
{% do perms.add_or_skip_action("config", values.storage.config, perms_config) %}

{% for store in values.storage.additional_storage %}
  {% do app.add_storage(store.mount_path, store) %}
  {% do perms.add_or_skip_action(store.mount_path, store, perms_config) %}
{% endfor %}

{% if perms.has_actions() %}
  {% do perms.activate() %}
  {% do app.depends.add_dependency(values.consts.perms_container_name, "service_completed_successfully") %}
{% endif %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
